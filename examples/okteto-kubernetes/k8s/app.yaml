apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-backend
  labels:
    app.kubernetes.io/name: demo-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-backend
    spec:
      containers:
        - name: backend
          image: __BACKEND_IMAGE__
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: FLOCI_ENDPOINT
              value: http://floci:4566
            - name: AWS_DEFAULT_REGION
              value: us-east-1
            - name: AWS_ACCESS_KEY_ID
              value: demo
            - name: AWS_SECRET_ACCESS_KEY
              value: demo
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: demo-backend
spec:
  selector:
    app.kubernetes.io/name: demo-backend
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-frontend
  labels:
    app.kubernetes.io/name: demo-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-frontend
    spec:
      containers:
        - name: frontend
          image: __FRONTEND_IMAGE__
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 101
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: demo-frontend
spec:
  selector:
    app.kubernetes.io/name: demo-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-frontend
  annotations:
    dev.okteto.com/generate-host: "true"
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: demo-frontend
                port:
                  number: 80
